<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEXYN | تحميل التطبيق</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #163b78 0%, #091426 45%, #030712 100%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    .logo {
      width: 110px;
      height: 110px;
      margin: 0 auto 25px;
      border-radius: 30px;
      background: linear-gradient(135deg, #1677ff, #00c6ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: bold;
      box-shadow: 0 0 50px rgba(0, 140, 255, 0.45);
    }

    h1 {
      font-size: 42px;
      letter-spacing: 3px;
      margin-bottom: 15px;
    }

    .subtitle {
      color: #b7c4d8;
      font-size: 18px;
      line-height: 1.8;
      margin-bottom: 35px;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(15px);
      border-radius: 25px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .download-btn {
      display: block;
      width: 100%;
      padding: 20px;
      border-radius: 16px;
      background: linear-gradient(135deg, #1677ff, #00c6ff);
      color: white;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
      transition: 0.3s;
      margin-bottom: 20px;
    }

    .download-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(0, 140, 255, 0.4);
    }

    .info {
      color: #9aa8bb;
      font-size: 14px;
      line-height: 1.8;
    }

    .version {
      margin-top: 25px;
      color: #6f819b;
      font-size: 13px;
    }

    .footer {
      margin-top: 30px;
      color: #66758b;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      N
    </div>

    <h1>NEXYN</h1>

    <p class="subtitle">
      حمّل تطبيق NEXYN الآن واستمتع بتجربة سهلة وسريعة.
    </p>

    <div class="card">

      <a
        class="download-btn"
        href="https://github.com/keromaged4/NEXYN/releases/download/v1.0.0/app-release.apk"
      >
        ⬇ تحميل تطبيق NEXYN
      </a>

      <p class="info">
        التطبيق متاح حاليًا لأجهزة Android.
        <br>
        قد تحتاج إلى السماح بالتثبيت من مصادر خارجية عند تحميل التطبيق لأول مرة.
      </p>

      <p class="version">
        الإصدار 1.0.0
      </p>

    </div>

    <div class="footer">
      © 2026 NEXYN. All rights reserved.
    </div>

  </div>

</body>
</html>
